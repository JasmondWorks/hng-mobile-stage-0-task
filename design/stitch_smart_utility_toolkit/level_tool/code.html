<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Digital Level - Smart Utility Toolkit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#e2dfff",
                    "surface-container-lowest": "#ffffff",
                    "secondary-dim": "#545353",
                    "on-primary-fixed": "#2300d2",
                    "secondary-container": "#e5e2e1",
                    "primary": "#483ff0",
                    "surface-tint": "#483ff0",
                    "on-error-container": "#782232",
                    "primary-fixed-dim": "#d2d0ff",
                    "inverse-primary": "#8382ff",
                    "secondary-fixed": "#e5e2e1",
                    "tertiary-dim": "#4b526c",
                    "on-surface-variant": "#5f5f5f",
                    "on-primary-fixed-variant": "#453ced",
                    "on-primary": "#faf6ff",
                    "inverse-on-surface": "#9e9c9c",
                    "tertiary": "#575e78",
                    "on-tertiary": "#f9f8ff",
                    "on-secondary": "#fbf8f8",
                    "surface-container-low": "#f6f3f2",
                    "tertiary-fixed": "#d2d9f8",
                    "on-secondary-container": "#525151",
                    "tertiary-fixed-dim": "#c4cbe9",
                    "tertiary-container": "#d2d9f8",
                    "error": "#9e3f4e",
                    "on-tertiary-fixed": "#313951",
                    "on-primary-container": "#3a2de3",
                    "on-secondary-fixed-variant": "#5c5b5b",
                    "secondary-fixed-dim": "#d6d4d3",
                    "surface-dim": "#dbdad9",
                    "on-tertiary-container": "#444c65",
                    "on-surface": "#323232",
                    "on-tertiary-fixed-variant": "#4e556f",
                    "surface-container-high": "#eae8e7",
                    "outline-variant": "#b3b1b1",
                    "surface-container-highest": "#e4e2e2",
                    "outline": "#7b7a7a",
                    "on-secondary-fixed": "#403f3f",
                    "on-error": "#fff7f7",
                    "surface-variant": "#e4e2e2",
                    "surface-bright": "#fcf9f8",
                    "primary-dim": "#3a2ee4",
                    "inverse-surface": "#0e0e0e",
                    "error-dim": "#4f0116",
                    "background": "#fcf9f8",
                    "surface": "#fcf9f8",
                    "primary-fixed": "#e2dfff",
                    "secondary": "#605f5f",
                    "surface-container": "#f0eded",
                    "on-background": "#323232",
                    "error-container": "#ff8b9a"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        .glass {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen selection:bg-primary-container">
<!-- TopAppBar -->
<header class="bg-[#fcf9f8]/80 backdrop-blur-xl fixed top-0 w-full z-50 shadow-[0_8px_32px_0_rgba(50,50,50,0.06)] transition-colors duration-300">
<div class="flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-[#323232]/60 hover:opacity-70">
<span class="material-symbols-outlined">grid_view</span>
</button>
</div>
<h1 class="font-['Inter'] tracking-tight font-bold text-[#323232]">UTILITY</h1>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</div>
</header>
<main class="pt-24 pb-32 px-6 flex flex-col items-center max-w-2xl mx-auto min-h-screen">
<!-- Tool Status Header -->
<div class="w-full mb-12 flex flex-col items-center">
<span class="text-[10px] font-bold uppercase tracking-[0.2em] text-secondary opacity-60 mb-2">High-Precision Digital Level</span>
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<span class="text-sm font-medium tracking-tight text-on-surface">CALIBRATED</span>
</div>
</div>
<!-- Main Level Interface (Bento Style Layout) -->
<div class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">
<!-- Degree Readout X -->
<div class="bg-surface-container-low rounded-xl p-8 flex flex-col justify-between border border-outline-variant/15">
<span class="text-[10px] font-bold uppercase tracking-widest text-secondary opacity-50">Axis X</span>
<div class="flex items-baseline gap-1 mt-4">
<span class="text-6xl font-extrabold tracking-tighter text-on-surface">0.4</span>
<span class="text-2xl font-light text-primary">°</span>
</div>
<div class="mt-6 w-full h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-[52%]"></div>
</div>
</div>
<!-- Degree Readout Y -->
<div class="bg-surface-container-low rounded-xl p-8 flex flex-col justify-between border border-outline-variant/15">
<span class="text-[10px] font-bold uppercase tracking-widest text-secondary opacity-50">Axis Y</span>
<div class="flex items-baseline gap-1 mt-4">
<span class="text-6xl font-extrabold tracking-tighter text-on-surface">0.1</span>
<span class="text-2xl font-light text-primary">°</span>
</div>
<div class="mt-6 w-full h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary w-[48%]"></div>
</div>
</div>
<!-- Primary Bubble Level (Hero Section) -->
<div class="md:col-span-2 bg-surface-container-lowest rounded-xl p-12 flex flex-col items-center justify-center border border-outline-variant/15 relative overflow-hidden">
<!-- Decorative Grid Lines -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-size: 40px 40px; background-image: linear-gradient(to right, #323232 1px, transparent 1px), linear-gradient(to bottom, #323232 1px, transparent 1px);"></div>
<!-- Circular Level UI -->
<div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full border border-outline-variant/30 flex items-center justify-center">
<!-- Crosshairs -->
<div class="absolute top-1/2 left-0 w-full h-[1px] bg-outline-variant/20"></div>
<div class="absolute left-1/2 top-0 h-full w-[1px] bg-outline-variant/20"></div>
<!-- Center Target Ring -->
<div class="w-20 h-20 rounded-full border-2 border-primary/20 flex items-center justify-center">
<div class="w-4 h-4 rounded-full border border-primary"></div>
</div>
<!-- The Kinetic "Bubble" -->
<div class="absolute translate-x-4 -translate-y-2 w-12 h-12 rounded-full bg-gradient-to-br from-primary to-primary-dim shadow-xl flex items-center justify-center transition-all duration-300">
<div class="w-3 h-3 rounded-full bg-white/20 blur-[1px]"></div>
</div>
</div>
<div class="mt-12 flex gap-12 text-center">
<div>
<p class="text-[10px] font-bold uppercase tracking-widest text-secondary opacity-50 mb-1">Tilt Direction</p>
<p class="text-sm font-semibold text-on-surface">NORTH EAST</p>
</div>
<div>
<p class="text-[10px] font-bold uppercase tracking-widest text-secondary opacity-50 mb-1">Stability</p>
<p class="text-sm font-semibold text-on-surface">98.4%</p>
</div>
</div>
</div>
<!-- Controls Bento Card -->
<div class="md:col-span-2 grid grid-cols-2 gap-4">
<button class="bg-gradient-to-br from-primary to-primary-dim text-white rounded-xl p-6 flex flex-col items-center justify-center gap-3 active:scale-95 transition-all shadow-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">recenter</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Calibrate Tool</span>
</button>
<button class="bg-surface-container-high text-on-surface rounded-xl p-6 flex flex-col items-center justify-center gap-3 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary">volume_up</span>
<span class="text-[10px] font-bold uppercase tracking-widest">Audio Alerts On</span>
</button>
</div>
</div>
<!-- Extra Detail Footer -->
<div class="mt-12 text-center space-y-2">
<p class="text-[10px] text-secondary opacity-40 uppercase tracking-widest">Precision 0.01° | Latency 12ms</p>
<div class="flex justify-center gap-4 opacity-30 grayscale">
<span class="material-symbols-outlined text-xs">speed</span>
<span class="material-symbols-outlined text-xs">compass_calibration</span>
<span class="material-symbols-outlined text-xs">analytics</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-8 left-0 right-0 z-50 flex justify-around items-center px-4">
<div class="bg-[#fcf9f8]/80 backdrop-blur-xl fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md rounded-full border border-[#b3b1b1]/15 shadow-[0_24px_40px_rgba(50,50,50,0.06)] flex justify-around items-center h-16 px-2">
<a class="text-[#323232]/40 p-3 hover:text-[#483ff0] transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">currency_exchange</span>
</a>
<a class="bg-gradient-to-br from-[#483ff0] to-[#3a2ee4] text-white rounded-full p-3 scale-110 shadow-lg active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">straighten</span>
</a>
<a class="text-[#323232]/40 p-3 hover:text-[#483ff0] transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">history</span>
</a>
<a class="text-[#323232]/40 p-3 hover:text-[#483ff0] transition-colors active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">settings</span>
</a>
</div>
</nav>
</body></html>
