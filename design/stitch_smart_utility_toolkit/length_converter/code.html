<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Length Converter</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-low": "#f6f3f2",
                    "surface-container": "#f0eded",
                    "on-surface-variant": "#5f5f5f",
                    "on-tertiary": "#f9f8ff",
                    "on-secondary-container": "#525151",
                    "tertiary-container": "#d2d9f8",
                    "inverse-on-surface": "#9e9c9c",
                    "on-primary-container": "#3a2de3",
                    "secondary-fixed-dim": "#d6d4d3",
                    "on-primary-fixed": "#2300d2",
                    "tertiary-fixed-dim": "#c4cbe9",
                    "on-secondary-fixed-variant": "#5c5b5b",
                    "primary": "#483ff0",
                    "secondary": "#605f5f",
                    "primary-dim": "#3a2ee4",
                    "secondary-fixed": "#e5e2e1",
                    "secondary-dim": "#545353",
                    "on-tertiary-fixed-variant": "#4e556f",
                    "on-tertiary-fixed": "#313951",
                    "inverse-surface": "#0e0e0e",
                    "on-surface": "#323232",
                    "on-error": "#fff7f7",
                    "surface-dim": "#dbdad9",
                    "surface-container-highest": "#e4e2e2",
                    "error": "#9e3f4e",
                    "background": "#fcf9f8",
                    "outline-variant": "#b3b1b1",
                    "error-container": "#ff8b9a",
                    "tertiary-dim": "#4b526c",
                    "surface": "#fcf9f8",
                    "outline": "#7b7a7a",
                    "secondary-container": "#e5e2e1",
                    "surface-variant": "#e4e2e2",
                    "on-tertiary-container": "#444c65",
                    "on-background": "#323232",
                    "surface-container-high": "#eae8e7",
                    "surface-tint": "#483ff0",
                    "tertiary": "#575e78",
                    "on-secondary": "#fbf8f8",
                    "on-secondary-fixed": "#403f3f",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#e2dfff",
                    "primary-fixed-dim": "#d2d0ff",
                    "on-primary-fixed-variant": "#453ced",
                    "inverse-primary": "#8382ff",
                    "on-primary": "#faf6ff",
                    "surface-bright": "#fcf9f8",
                    "tertiary-fixed": "#d2d9f8",
                    "error-dim": "#4f0116",
                    "on-error-container": "#782232",
                    "primary-container": "#e2dfff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen selection:bg-primary/20">
<!-- Shared TopAppBar -->
<header class="bg-[#fcf9f8]/80 dark:bg-[#323232]/80 backdrop-blur-xl fixed top-0 w-full z-50">
<div class="flex items-center justify-between px-6 h-16 w-full max-w-screen-xl mx-auto">
<button class="active:scale-95 transition-transform hover:opacity-70 transition-opacity text-[#483ff0] dark:text-[#5852FF]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-[#323232] dark:text-[#fcf9f8] font-['Inter']">Length Converter</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</div>
</header>
<main class="pt-24 pb-48 px-6 max-w-lg mx-auto">
<!-- Conversion Display -->
<div class="space-y-4">
<!-- From Input Card -->
<div class="bg-surface-container-low rounded-xl p-6 transition-all border border-transparent focus-within:border-outline-variant/30">
<div class="flex justify-between items-center mb-2">
<span class="label-sm text-on-surface-variant font-label uppercase tracking-widest text-[10px] font-bold">From</span>
<button class="flex items-center gap-2 bg-surface-container-lowest px-3 py-1.5 rounded-full text-on-surface hover:bg-surface-container-high transition-colors">
<span class="text-sm font-semibold">Meters</span>
<span class="material-symbols-outlined text-[18px]" data-icon="expand_more">expand_more</span>
</button>
</div>
<div class="flex items-baseline justify-end overflow-hidden">
<span class="text-5xl font-extrabold tracking-tighter text-on-surface">1,240.5</span>
<span class="text-xl font-medium text-on-surface-variant ml-2">m</span>
</div>
</div>
<!-- Kinetic Inversion Button -->
<div class="flex justify-center -my-6 relative z-10">
<button class="bg-gradient-to-br from-[#483ff0] to-[#3a2ee4] text-white p-4 rounded-full shadow-[0_8px_32px_rgba(72,63,240,0.25)] active:scale-90 transition-transform">
<span class="material-symbols-outlined font-bold" data-icon="sync_alt">sync_alt</span>
</button>
</div>
<!-- To Input Card -->
<div class="bg-surface-container-lowest border border-surface-container-high rounded-xl p-6 transition-all">
<div class="flex justify-between items-center mb-2">
<span class="label-sm text-on-surface-variant font-label uppercase tracking-widest text-[10px] font-bold">To</span>
<button class="flex items-center gap-2 bg-surface-container-low px-3 py-1.5 rounded-full text-on-surface hover:bg-surface-container-high transition-colors">
<span class="text-sm font-semibold">Feet</span>
<span class="material-symbols-outlined text-[18px]" data-icon="expand_more">expand_more</span>
</button>
</div>
<div class="flex items-baseline justify-end overflow-hidden">
<span class="text-5xl font-extrabold tracking-tighter text-primary">4,069.88</span>
<span class="text-xl font-medium text-primary/70 ml-2">ft</span>
</div>
</div>
</div>
<!-- Custom Numeric Keypad -->
<div class="mt-8 grid grid-cols-3 gap-3">
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">1</button>
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">2</button>
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">3</button>
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">4</button>
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">5</button>
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">6</button>
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">7</button>
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">8</button>
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">9</button>
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">.</button>
<button class="h-16 bg-surface-container-low rounded-xl flex items-center justify-center text-xl font-bold active:scale-95 active:bg-surface-container-high transition-all">0</button>
<button class="h-16 bg-surface-container-low/50 text-error rounded-xl flex items-center justify-center active:scale-95 active:bg-error/10 transition-all">
<span class="material-symbols-outlined" data-icon="backspace">backspace</span>
</button>
</div>
<div class="mt-8 bg-surface-container-low/30 p-4 rounded-xl">
<h3 class="label-sm text-on-surface-variant font-label uppercase tracking-widest text-[10px] font-bold mb-3">Common Standards</h3>
<div class="flex gap-2 overflow-x-auto hide-scrollbar">
<button class="px-4 py-2 bg-surface-container-lowest border border-outline-variant/10 rounded-lg text-sm font-medium whitespace-nowrap active:scale-95 transition-transform">Human Height</button>
<button class="px-4 py-2 bg-surface-container-lowest border border-outline-variant/10 rounded-lg text-sm font-medium whitespace-nowrap active:scale-95 transition-transform">Standard Track</button>
<button class="px-4 py-2 bg-surface-container-lowest border border-outline-variant/10 rounded-lg text-sm font-medium whitespace-nowrap active:scale-95 transition-transform">Door Height</button>
</div>
</div>
</main>
<!-- Shared BottomNavBar -->
<div class="fixed bottom-0 w-full z-50 flex justify-around items-center pb-8">
<nav class="bg-[#fcf9f8]/80 dark:bg-[#323232]/80 backdrop-blur-xl w-[90%] max-w-md rounded-full px-4 py-3 flex justify-around items-center shadow-[0_8px_32px_rgba(50,50,50,0.06)]">
<a class="bg-gradient-to-br from-[#483ff0] to-[#3a2ee4] text-white rounded-full p-3 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="sync_alt">sync_alt</span>
</a>
<a class="text-[#323232] dark:text-[#fcf9f8] p-3 hover:bg-[#f6f3f2] dark:hover:bg-white/10 rounded-full transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="calculate">calculate</span>
</a>
<a class="text-[#323232] dark:text-[#fcf9f8] p-3 hover:bg-[#f6f3f2] dark:hover:bg-white/10 rounded-full transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="schedule">schedule</span>
</a>
<a class="text-[#323232] dark:text-[#fcf9f8] p-3 hover:bg-[#f6f3f2] dark:hover:bg-white/10 rounded-full transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</a>
</nav>
</div>
<!-- Background Decorative Elements -->
<div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-20">
<div class="absolute top-[10%] left-[10%] w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-[20%] right-[5%] w-96 h-96 bg-tertiary-container/20 rounded-full blur-3xl"></div>
</div>
</body></html>
